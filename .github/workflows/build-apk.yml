name: Build release APK

# Manual only: press "Run workflow" in the Actions tab. No tags, no auto-release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version name override (e.g. 1.0.1) — empty keeps build.gradle.kts"
        required: false
        default: ""
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to publish the GitHub Release
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Override version (optional)
        if: inputs.version != ''
        run: |
          sed -i -E 's/versionName = "[^"]+"/versionName = "${{ inputs.version }}"/' app/build.gradle.kts
          grep -E 'versionName' app/build.gradle.kts

      - name: Resolve version
        id: ver
        run: |
          if [ -n "${{ inputs.version }}" ]; then VER="${{ inputs.version }}"; else VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts); fi
          echo "VER=$VER" >> "$GITHUB_OUTPUT"

      - name: Decode keystore (skipped when secret absent)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          else
            echo "No KEYSTORE_BASE64 secret - building unsigned."
          fi

      - name: Build release APK
        env:
          # Relative to the app/ module dir (Gradle file() resolves there).
          KEYSTORE_FILE: ../release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --console=plain

      - name: Rename APK with version
        run: |
          VER="${{ steps.ver.outputs.VER }}"
          APK=$(ls app/build/outputs/apk/release/app-release*.apk | head -n 1)
          mv "$APK" "app/build/outputs/apk/release/izs-nettools-v${VER}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: izs-nettools-release
          path: app/build/outputs/apk/release/izs-nettools-*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.ver.outputs.VER }}"
          gh release delete "$TAG" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$TAG" --title "$TAG" --notes "Signed release APK." "app/build/outputs/apk/release/izs-nettools-v${{ steps.ver.outputs.VER }}.apk"
